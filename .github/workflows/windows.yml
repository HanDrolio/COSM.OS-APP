name: Build COSM.OS LOCAL for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test JavaScript core
        run: npm test
      - name: Download bundled CPU inference engine
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: COSM.OS-LOCAL-Windows-Installer
          path: dist/*.exe
