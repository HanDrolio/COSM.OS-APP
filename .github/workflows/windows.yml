name: Build COSM.OS LOCAL for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test JavaScript core
        run: npm test
      - name: Download bundled CPU inference engine
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1
      - name: Package trainer and data importer executables
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          pyinstaller --noconfirm --clean --onefile --windowed --name COSM.OS-Model-Trainer --distpath dist-trainer --workpath build-trainer --specpath build-trainer --add-data "training/train_lora.py;training" training/control_board.py
          pyinstaller --noconfirm --clean --onefile --console --name COSM.OS-Data-Importer --distpath dist-trainer --workpath build-importer --specpath build-importer training/feed_data.py
          if (!(Test-Path 'dist-trainer/COSM.OS-Model-Trainer.exe') -or !(Test-Path 'dist-trainer/COSM.OS-Data-Importer.exe')) { throw 'Trainer packaging failed' }
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: COSM.OS-LOCAL-Windows-Installer
          path: dist/*.exe
